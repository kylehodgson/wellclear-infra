server {
    listen 80;
    server_name _;

    # tar1090 static app
    location /tar1090 {
        alias /usr/share/nginx/html/tar1090;
        add_header Cache-Control "no-cache";
    }

    # readsb JSON output (shared volume from readsb-hub, read-only here)
    location /tar1090/data/ {
        alias /data/;
        add_header Cache-Control "no-cache";
    }

    # readsb writes these files gzip-compressed under a .json name
    # (writeJsonToGzip); the browser must transparently decompress them or
    # tar1090's JSON fetches silently fail. Mirrors upstream's lighttpd
    # config (88-tar1090.conf: Content-Encoding => gzip for traces/globe).
    location /tar1090/data/traces/ {
        alias /data/traces/;
        add_header Cache-Control "no-cache";
        add_header Content-Encoding "gzip";
    }

    # globe history archive: per-date traces for history/replay
    location /tar1090/globe_history/ {
        alias /usr/share/nginx/html/tar1090/globe_history/;
        add_header Cache-Control "public, max-age=3600";
        add_header Content-Encoding "gzip";
    }

    location = / {
        return 302 /tar1090/;
    }
}
