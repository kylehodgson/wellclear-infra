server {
    listen 80;
    server_name _;

    # tar1090 static app
    location /tar1090 {
        alias /usr/share/nginx/html/tar1090;
        add_header Cache-Control "no-cache";
    }

    # readsb JSON output (shared volume from readsb-hub, read-only here)
    location /tar1090/data/ {
        alias /data/;
        add_header Cache-Control "no-cache";
    }

    location = / {
        return 302 /tar1090/;
    }
}
